/* payment */

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function track(n,d){try{window.dataLayer=window.dataLayer||[];window.dataLayer.push(Object.assign({event:n},d||{}));if(window.gtag)gtag("event",n,d||{})}catch(e){}}
function tx(k){return T[lang][k]||T.en[k]||k}
function fmtPkr(n){return "Rs. "+Math.round(n).toLocaleString("en-US")}
function fmtTime(ms){return new Date(ms).toLocaleString("en-GB",{timeZone:"Asia/Karachi",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:true})}
function pkrFor(usd){return Math.ceil(usd*(RATE.market+CONFIG.MARKUP_PER_USD)/10)*10}

/* ================= RATE ================= */
async function fetchRate(){
  var c=ls("usdpkr");
  if(c){try{c=JSON.parse(c);if(Date.now()-c.ts<3600000){return c}}catch(e){}}
  var urls=["https://open.er-api.com/v6/latest/USD","https://api.exchangerate-api.com/v4/latest/USD"];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i]);var j=await r.json();var v=j.rates&&j.rates.PKR;
      if(v&&v>50&&v<1000){var o={market:v,ts:Date.now(),live:true};ls("usdpkr",JSON.stringify(o));return o}
    }catch(e){}
  }
  if(c&&c.market)return {market:c.market,ts:c.ts,live:false};
  return {market:CONFIG.FALLBACK_RATE,ts:Date.now(),live:false,fallback:true};
}

/* ================= RENDER ================= */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(el){var k=el.getAttribute("data-i");var v=tx(k);if(v!==k)el.textContent=v});
  $("#langBtn").textContent=lang==="ur"?"English":"اردو";
  renderTabs();renderLib();buildPlanSelect();renderMethods();renderRate();renderQuote();
}
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(function(t){return '<button type="button" class="tab'+(t.id===tabNow?' on':'')+'" data-tab="'+t.id+'">'+t[lang]+'</button>'}).join("");
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tabNow=b.dataset.tab;renderTabs();renderLib()}});
}
function renderLib(){
  var list=PRODUCTS.filter(function(p){return tabNow==="all"||p.tab===tabNow});
  $("#lib").innerHTML=list.map(function(p){
    var price=p.usd==null?'<div class="price"><small>'+tx("separate")+'</small></div>':'<div class="price">$'+p.usd.toFixed(2)+(RATE?'<small>≈ '+fmtPkr(pkrFor(p.usd))+'</small>':'')+'</div>';
    var btn=p.usd==null?'<a class="btn sm" target="_blank" rel="noopener" href="'+CONFIG.PRAOS_URL+'" data-track="praos_whatsapp_click">WhatsApp</a>':'<button class="btn sm" type="button" data-buy="'+p.id+'">'+tx("buy")+'</button>';
    return '<div class="card pc"><div class="cover"><span class="lock">🔒 '+tx("locked")+'</span><small>SAK COACHING · '+p.tag+'</small><b>'+p.name.en+'</b><i>By SAK Hashmi</i></div><h3>'+p.name[lang]+'</h3><p class="note">'+p.line[lang]+'</p>'+price+'<div style="margin-top:10px">'+btn+'</div></div>';
  }).join("");
  document.querySelectorAll("[data-buy]").forEach(function(b){b.onclick=function(){goPlan(b.dataset.buy)}});
}
function renderRate(){
  if(!RATE)return;
  var a=RATE.market+CONFIG.MARKUP_PER_USD;
  var s=tx("rateline").replace("{a}",a.toFixed(2)).replace("{m}",RATE.market.toFixed(2)).replace("{k}",CONFIG.MARKUP_PER_USD).replace("{t}",fmtTime(RATE.ts));
  if(!RATE.live)s+=" ⚠";
  $("#rateNote").textContent=s;
  $("#yrPkr").textContent="≈ "+fmtPkr(pkrFor(CONFIG.USD.yearly));
}

/* ================= CHECKOUT ================= */
function planList(){
  var a=PRODUCTS.filter(function(p){return p.usd!=null}).map(function(p){return {id:p.id,label:p.name.en,usd:p.usd}});
  a.push({id:"bundle",label:"Starter Bundle (6 books)",usd:CONFIG.USD.bundle});
  a.push({id:"yearly",label:"PRO Yearly",usd:CONFIG.USD.yearly});
  return a;
}
function buildPlanSelect(){
  var sel=$("#plan"),cur=sel.value||"bundle";
  sel.innerHTML=planList().map(function(p){return '<option value="'+p.id+'">'+p.label+' · $'+p.usd.toFixed(2)+'</option>'}).join("");
  sel.value=cur;if(sel.value!==cur)sel.selectedIndex=0;
}
function goPlan(id){$("#plan").value=id;track("plan_selected",{plan:id});QUOTE=null;renderQuote();location.hash="#checkout"}
function renderMethods(){
  var cur=$("#methodVal").value;
  $("#methods").innerHTML=Object.keys(CONFIG.ACCOUNTS).map(function(m){return '<div class="m'+(m===cur?' on':'')+'" data-m="'+m+'">'+m+'</div>'}).join("");
  document.querySelectorAll(".m").forEach(function(el){el.onclick=function(){pickMethod(el.dataset.m)}});
  showAcct();
}
function pickMethod(m){
  $("#methodVal").value=m;track("payment_method_selected",{method:m});
  newQuote(false);renderMethods();renderQuote();
}
function showAcct(){
  var m=$("#methodVal").value,box=$("#acct");
  if(!m){box.style.display="none";return}
  var a=CONFIG.ACCOUNTS[m];box.style.display="block";
  box.innerHTML='<div>'+tx("acct_title")+': <b>'+a.title+'</b></div><div>'+tx("acct_no")+': <code id="acctNo">'+a.number+'</code> <button type="button" class="ctrl" id="cpy">'+tx("copy")+'</button></div>';
  $("#cpy").onclick=function(){try{navigator.clipboard.writeText(a.number)}catch(e){}this.textContent=tx("copied")};
}
function newQuote(notify){
  if(!RATE)return;
  var id=$("#plan").value,p=planList().filter(function(x){return x.id===id})[0];if(!p)return;
  var applied=RATE.market+CONFIG.MARKUP_PER_USD,now=Date.now();
  QUOTE={plan:id,usd:p.usd,market:RATE.market,markup:CONFIG.MARKUP_PER_USD,applied:applied,pkr:pkrFor(p.usd),ts:now,exp:now+CONFIG.QUOTE_HOURS*3600000};
  track("quote_locked",{plan:id,pkr:QUOTE.pkr});
  if(notify)$("#perr").textContent=tx("expired");
}
function renderQuote(){
  var box=$("#quote");
  if(!QUOTE){box.innerHTML=tx("select_method");setHidden();return}
  if(Date.now()>QUOTE.exp){track("quote_expired");newQuote(true)}
  box.innerHTML=tx("pay_exact")+': <b class="big">'+fmtPkr(QUOTE.pkr)+'</b><br><span class="note">$'+QUOTE.usd.toFixed(2)+' · '+tx("rateline").replace("{a}",QUOTE.applied.toFixed(2)).replace("{m}",QUOTE.market.toFixed(2)).replace("{k}",QUOTE.markup).replace("{t}",fmtTime(QUOTE.ts))+'<br>'+tx("quoteline").replace("{t}",fmtTime(QUOTE.exp))+'</span>';
  setHidden();
}
function setHidden(){
  var q=QUOTE||{};
  $("#q_usd").value=q.usd||"";$("#q_mkt").value=q.market?q.market.toFixed(2):"";$("#q_mk").value=q.markup||"";$("#q_app").value=q.applied?q.applied.toFixed(2):"";$("#q_pkr").value=q.pkr||"";
  $("#q_time").value=q.ts?new Date(q.ts).toISOString():"";$("#q_exp").value=q.exp?new Date(q.exp).toISOString():"";
}

/* ================= FORM VALIDATION ================= */
$("#shot").addEventListener("change",function(){
  var f=this.files[0],pv=$("#prev");pv.textContent="";
  if(!f)return;
  var okType=/^(image\/jpeg|image\/png|application\/pdf)$/.test(f.type);
  if(!okType||f.size>5*1024*1024){$("#perr").textContent=tx("e_file");this.value="";return}
  $("#perr").textContent="";pv.textContent="✓ "+f.name+" ("+Math.round(f.size/1024)+" KB)";
});
$("#plan").addEventListener("change",function(){QUOTE=null;if($("#methodVal").value)newQuote(false);renderQuote()});
$("#payform").addEventListener("submit",function(e){
  var err=$("#perr");err.textContent="";
  var m=$("#methodVal").value,tid=$("#tid").value.trim(),f=$("#shot").files[0];
  if(!m){e.preventDefault();err.textContent=tx("e_method");return}
  if(!$("#pn").value.trim()||!$("#pe").value.trim()||!$("#pw").value.trim()||!$("#amt").value||!$("#pdt").value){e.preventDefault();err.textContent=tx("e_fill");return}
  if(!/^[A-Za-z0-9]{6,20}$/.test(tid)){e.preventDefault();err.textContent=tx("e_tid");return}
  var seen=[];try{seen=JSON.parse(ls("tids")||"[]")}catch(x){}
  if(seen.indexOf(tid.toUpperCase())>-1){e.preventDefault();err.textContent=tx("e_dup");return}
  if(!f||f.size>5*1024*1024){e.preventDefault();err.textContent=tx("e_file");return}
  if(QUOTE&&Date.now()>QUOTE.exp){e.preventDefault();newQuote(true);renderQuote();return}
  if(QUOTE&&Number($("#amt").value)<QUOTE.pkr){e.preventDefault();err.textContent=tx("e_amt");return}
  seen.push(tid.toUpperCase());ls("tids",JSON.stringify(seen));
  track("local_payment_submitted",{method:m,plan:$("#plan").value});
});
document.getElementById("regform").addEventListener("submit",function(){track("form_submit",{form:"free_month"})});

/* ================= INIT ================= */
function setLinks(){
  var wa="https://wa.me/"+CONFIG.SUPPORT_WHATSAPP;
  $("#waFloat").href=wa+"?text="+encodeURIComponent("Assalam o Alaikum, I have a question about SAK Coaching.");
  $("#praosBtn").href=CONFIG.PRAOS_URL;
  $("#callBtn").href=CONFIG.CALL_URL||(wa+"?text="+encodeURIComponent("I would like to book the 24-minute discovery call."));
  $("#paypalBtn").href=CONFIG.PAYPAL_URL||(wa+"?text="+encodeURIComponent("I would like to pay by PayPal."));
  $("#cardBtn").href=CONFIG.CARD_URL||(wa+"?text="+encodeURIComponent("I would like to pay by card."));
}
function countdown(){
  var t=new Date("2026-10-17T14:00:00+05:00").getTime();
  function tick(){var d=Math.max(0,t-Date.now());$("#cdD").textContent=Math.floor(d/864e5);$("#cdH").textContent=Math.floor(d%864e5/36e5);$("#cdM").textContent=Math.floor(d%36e5/6e4);$("#cdS").textContent=Math.floor(d%6e4/1e3)}
  tick();setInterval(tick,1000);
}
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-track]");if(a)track(a.getAttribute("data-track"));
  var pl=e.target.closest("[data-plan]");if(pl)goPlan(pl.getAttribute("data-plan"));
});
$("#langBtn").onclick=function(){lang=lang==="ur"?"en":"ur";ls("lang",lang);applyLang()};
$("#themeBtn").onclick=function(){var d=document.documentElement;var n=d.getAttribute("data-theme")==="dark"?"light":"dark";d.setAttribute("data-theme",n);ls("theme",n);this.textContent=n==="dark"?"☀":"☾"};
(function init(){
  var sl=ls("lang");if(sl==="en"||sl==="ur")lang=sl;
  var st=ls("theme");if(st){document.documentElement.setAttribute("data-theme",st);$("#themeBtn").textContent=st==="dark"?"☀":"☾"}
  var qs=location.search;
  if(qs.indexOf("thanks=1")>-1){$("#thanks").style.display="block";track("form_submit_done")}
  setLinks();countdown();applyLang();
  if(qs.indexOf("paid=1")>-1){var b=$("#paidOk");b.textContent=tx("paid_ok")+CONFIG.VERIFY_TEXT[lang]+".";b.style.display="block"}
  fetchRate().then(function(r){RATE=r;renderLib();renderRate();if($("#methodVal").value){newQuote(false);renderQuote()}});
  setInterval(function(){if(QUOTE)renderQuote()},60000);
})();
</script>
</body>
</html>
